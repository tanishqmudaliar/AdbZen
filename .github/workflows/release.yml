name: Release VSIX

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        shell: bash
        run: |
          release_tag="${{ inputs.tag || github.ref_name }}"
          tag_version="${release_tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Prepare release notes
        shell: bash
        run: |
          release_tag="${{ inputs.tag || github.ref_name }}"
          tag_version="${release_tag#v}"
          git fetch --tags --force
          previous_tag="$(git tag --sort=-v:refname | grep -Fxv "$release_tag" | head -n 1)"
          test -n "$previous_tag"
          awk -v version="$tag_version" '
            $0 ~ "^## \\[" version "\\]" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          test -s release-notes.md
          printf '\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/%s...%s\n' "$previous_tag" "$release_tag" >> release-notes.md

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Package VSIX
        run: npx vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ github.run_id }}
          path: "*.vsix"
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: "*.vsix"

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix-${{ github.run_id }}
          path: release

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          vsix_file="$(find release -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          test -n "$vsix_file"
          npx vsce publish --packagePath "$vsix_file" --pat "$VSCE_PAT"
